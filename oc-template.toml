schema = 1

[template]
name = "Company Funding Lookup"
description = "Give it a company URL; it resolves the legal issuer and finds the last known financing from SEC Form D filings and company announcements, with sources, confidence and coverage gaps."
documentation = "https://github.com/diggerhq/company-funding-lookup#readme"
default_project_name = "company-funding"

[template.first_run]
agent = "funding"
prompt = "check https://example.com"

[template.runtime_variables.SEC_CONTACT_EMAIL]
description = "Contact email sent in the User-Agent of every SEC EDGAR request (SEC requires a real, monitored address). No SEC API key is needed."
required = true
example = "sec-contact@yourcompany.com"

[template.runtime_variables.CONTEXT_DEV_ENABLED]
description = "Optional. Set to 1 to use context.dev for company news and web search in the announcement check (also set the CONTEXT_DEV_API_KEY secret). Without it the report says the announcement check is incomplete."
required = false
example = "1"

[template.runtime_variables.OWNER_SIGNING_KEY]
description = "Optional. Only for serving several users through the bundled web app: a random 32+ character key shared with the app. Leave empty for a personal deployment (single owner)."
required = false
example = "a-long-random-string"

[template.secrets.CONTEXT_DEV_API_KEY]
description = "Optional context.dev API key (https://context.dev). Used only for news and web search; SEC lookups never need it."
